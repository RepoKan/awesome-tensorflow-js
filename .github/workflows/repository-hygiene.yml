name: Documentation and CodeRabbit validation

on:
  # CI always runs on pull requests, not just Markdown/configuration changes.
  pull_request:
  # Also verify repository health after an authorized merge to master.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: YAML and changed Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate CodeRabbit YAML and safety gates
        shell: bash
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          config = YAML.safe_load_file('.coderabbit.yaml')
          raise 'Configuration must be a mapping' unless config.is_a?(Hash)
          reviews = config.fetch('reviews')
          raise 'Automatic reviews must stay enabled' unless reviews.dig('auto_review', 'enabled') == true
          raise 'Automatic approvals must stay disabled' unless reviews.dig('auto_approvals', 'enabled') == false
          raise 'Automatic PR incremental reviews must remain enabled' unless reviews.dig('auto_review', 'auto_incremental_review') == true
          raise 'Automatic review pause must remain disabled' unless reviews.dig('auto_review', 'auto_pause_after_reviewed_commits') == 0
          raise 'Reviews must cover all PR target branches' unless reviews.dig('auto_review', 'base_branches')&.include?('.*')
          raise 'Automated bot approvals must remain disabled' unless reviews['request_changes_workflow'] == false
          raise 'Issue enrichment must be enabled' unless config.dig('issue_enrichment', 'auto_enrich', 'enabled') == true
          raise 'Automatic issue planning must be enabled' unless config.dig('issue_enrichment', 'planning', 'auto_planning', 'enabled') == true
          raise 'Automatic issue label mutation must stay disabled' unless config.dig('issue_enrichment', 'labeling', 'auto_apply_labels') == false
          fixes = reviews.fetch('finishing_touches')
          %w[autofix fix_ci resolve_merge_conflict].each do |key|
            raise "#{key} must remain enabled" unless fixes.dig(key, 'enabled') == true
          end
          puts 'CodeRabbit YAML and safety gates: PASS'
          RUBY

      - name: Check only new Markdown lines for trailing whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          result = subprocess.run(
              ['git', 'diff', '--no-ext-diff', '--unified=0',
               f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}",
               '--', '*.md'],
              check=True, text=True, capture_output=True)
          current_file = ''
          in_hunk = False
          failures = []
          for line in result.stdout.splitlines():
              if line.startswith('diff --git '):
                  in_hunk = False
              elif not in_hunk and line.startswith('+++ b/'):
                  current_file = line[6:]
              elif line.startswith('@@ '):
                  in_hunk = True
              elif in_hunk and line.startswith('+'):
                  added = line[1:]
                  if added.rstrip(' \t') != added:
                      failures.append(current_file)
          if failures:
              for path in sorted(set(failures)):
                  print(f'Added Markdown lines have trailing whitespace: {path}')
              sys.exit(1)
          print('Added Markdown whitespace: PASS')
          PY
