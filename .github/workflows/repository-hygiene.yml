name: Documentation and CodeRabbit validation

on:
  # CI always runs on pull requests, not just Markdown/configuration changes.
  pull_request:
  # Also verify repository health after an authorized merge to master.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: YAML and changed Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # These checks detect policy regressions; they are not independent approval.
      # Do not move PR-controlled code to pull_request_target or grant write access.
      - name: Test CodeRabbit policy rejection cases
        shell: bash
        run: ruby .github/scripts/test_coderabbit_policy.rb

      - name: Validate CodeRabbit YAML and safety gates
        shell: bash
        run: ruby .github/scripts/coderabbit_policy.rb .coderabbit.yaml

      - name: Check only new Markdown lines for trailing whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          result = subprocess.run(
              ['git', 'diff', '--no-ext-diff', '--unified=0',
               f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}",
               '--', '*.md'],
              check=True, text=True, capture_output=True)
          current_file = ''
          in_hunk = False
          failures = []
          for line in result.stdout.splitlines():
              if line.startswith('diff --git '):
                  in_hunk = False
              elif not in_hunk and line.startswith('+++ b/'):
                  current_file = line[6:]
              elif line.startswith('@@ '):
                  in_hunk = True
              elif in_hunk and line.startswith('+'):
                  added = line[1:]
                  if added.rstrip(' \t') != added:
                      failures.append(current_file)
          if failures:
              for path in sorted(set(failures)):
                  print(f'Added Markdown lines have trailing whitespace: {path}')
              sys.exit(1)
          print('Added Markdown whitespace: PASS')
          PY
