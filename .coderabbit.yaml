# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Documentation-first TensorFlow.js resource directory.
# CodeRabbit review and required CI are separate gates; RepoKan authorizes each final merge.
language: "en-US"
tone_instructions: >-
  Be concise, direct, and constructive. Prioritize verified problems in changed
  lines, explain impact and actionable fixes, and avoid speculative nitpicks.

reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    auto_incremental_review: true
    # Re-review every PR push until the PR is complete (subject to rate limits).
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches:
      - ".*"

  # Permit low-risk bot approvals; author approval commands stay disabled.
  # Bot approval never bypasses GitHub branch rules or required CI.
  auto_approvals:
    enabled: true
    allow_author_approval: false
    max_merge_risk: low
    # Requires an Advanced security architecture risk assessment at this SHA.
    max_security_risk: low
    # Policy or CI enforcement must never qualify for bot-only approval.
    overrides:
      - enabled: false
        paths:
          - ".coderabbit.yaml"
          - ".github/workflows/**"
          - ".github/CODEOWNERS"
          - "CODEOWNERS"
          - "docs/CODEOWNERS"

  pre_merge_checks:
    # There is no application source code or docstring surface in this repository.
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: >
        Describe the actual change clearly and specifically. A conventional
        type(scope): summary or a concise action-oriented title is acceptable.
    description:
      mode: "warning"
    custom_checks:
      - name: "New resources follow contribution scope"
        mode: "warning"
        instructions: |
          Apply only when a pull request adds curated resource entries to README.md.
          Otherwise pass as not applicable.
          Compare newly added resource URLs with existing README.md entries.
          Flag duplicate destinations or more than one new resource entry in one
          pull request, as CONTRIBUTING.md requests one resource link per PR.
          Do not count navigation links, badges, headings or prose URLs as entries.
          Report specific added lines and a correction supported by the diff.
          Do not flag unrelated or pre-existing README.md imperfections.

  path_instructions:
    - path: "README.md"
      instructions: |
        Review added or materially modified lines only. For new resources,
        verify TensorFlow.js relevance, placement in the correct category,
        reasonable alphabetical order within that category, descriptive link
        text, valid Markdown and a concise sentence-case description ending
        with a period when that category uses descriptions.
        Prefer HTTPS where available, but do not claim a URL is broken without
        verification. Ignore unchanged historical entries and formatting.
    - path: "CONTRIBUTING.md"
      instructions: |
        Check revised guidelines for clarity and consistency with README.md,
        including the one-resource-per-PR convention. Do not apply new rules
        retroactively to unchanged content.
    - path: ".coderabbit.yaml"
      instructions: |
        Validate settings against the current CodeRabbit schema. Retain
        automatic reviews and low-risk automatic approvals; prohibit author
        self-approval commands. Flag contradictory or duplicated rules and
        changes that weaken or self-validate their own safety gates.
        Treat relaxed risk limits, broader approval permissions, disabled
        review checks, and ruleset bypasses as high merge-risk indicators.
        Check that controls are independently enforced and not validated only
        by an assertion changed in the same PR. A completed CodeRabbit check
        is not proof that findings are resolved; CI and owner merge
        authorization remain separate.
    - path: ".github/workflows/**"
      instructions: |
        For newly added or modified workflows, review least-privilege token
        permissions, pinned third-party actions, and safe handling of secrets
        and untrusted pull request code. Treat changes to required checks,
        policy validation, approval enforcement, or workflow permissions as
        sensitive. Flag self-validating policy/CI edits, missing tests, and
        any weakening of protected-branch safety; report specific evidence.

  # Code-generation suggestions are not relevant to the current Markdown-only repo.
  finishing_touches:
    # Editing tools are enabled; the GitHub App still needs appropriate permissions.
    # The ongoing Autofix task is activated separately on each PR.
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"

# Issue enrichment is issue analysis, not an automatic code review or fix.
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
  labeling:
    auto_apply_labels: false
