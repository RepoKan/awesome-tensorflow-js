# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Documentation-first TensorFlow.js resource directory.
# Human approval and CI are separate merge gates; an AI review never replaces them.
language: "en-US"
tone_instructions: >-
  Be concise, direct, and constructive. Prioritize verified problems in changed
  lines, explain impact and actionable fixes, and avoid speculative nitpicks.

reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    auto_incremental_review: true
    # Re-review every PR push until the PR is complete (subject to rate limits).
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches:
      - ".*"

  # Preserve the repository CI safeguard; enabling bot approvals needs a separate policy change.
  auto_approvals:
    enabled: false
    allow_author_approval: false
    max_merge_risk: low

  pre_merge_checks:
    # There is no application source code or docstring surface in this repository.
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: >
        Describe the actual change clearly and specifically. A conventional
        type(scope): summary or a concise action-oriented title is acceptable.
    description:
      mode: "warning"
    custom_checks:
      - name: "New resources follow contribution scope"
        mode: "warning"
        instructions: |
          Apply only when a pull request adds curated resource entries to README.md.
          Otherwise pass as not applicable.
          Compare newly added resource URLs with existing README.md entries.
          Flag duplicate destinations or more than one new resource entry in one
          pull request, as CONTRIBUTING.md requests one resource link per PR.
          Do not count navigation links, badges, headings or prose URLs as entries.
          Report specific added lines and a correction supported by the diff.
          Do not flag unrelated or pre-existing README.md imperfections.

  path_instructions:
    - path: "README.md"
      instructions: |
        Review added or materially modified lines only. For new resources,
        verify TensorFlow.js relevance, placement in the correct category,
        reasonable alphabetical order within that category, descriptive link
        text, valid Markdown and a concise sentence-case description ending
        with a period when that category uses descriptions.
        Prefer HTTPS where available, but do not claim a URL is broken without
        verification. Ignore unchanged historical entries and formatting.
    - path: "CONTRIBUTING.md"
      instructions: |
        Check revised guidelines for clarity and consistency with README.md,
        including the one-resource-per-PR convention. Do not apply new rules
        retroactively to unchanged content.
    - path: ".coderabbit.yaml"
      instructions: |
        Validate settings against the current CodeRabbit schema. Retain automatic reviews. Keep automatic approvals disabled and prohibit
        author self-approval. Flag contradictory
        or duplicated rules. Bot approval does not replace independent human
        review, successful CI, or repository branch protection.
    - path: ".github/workflows/**"
      instructions: |
        For newly added or modified workflows, review least-privilege token
        permissions, pinned third-party actions, and safe handling of secrets
        and untrusted pull request code. Report risks in the changed lines.

  # Code-generation suggestions are not relevant to the current Markdown-only repo.
  finishing_touches:
    # Editing tools are enabled; the GitHub App still needs appropriate permissions.
    # The ongoing Autofix task is activated separately on each PR.
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"

# Issue enrichment is issue analysis, not an automatic code review or fix.
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
  labeling:
    auto_apply_labels: false
